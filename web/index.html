  <style>
    .lds-ring {
    display: inline-block;
    position: relative;
    width: 80px;
    height: 80px;
    }
    .lds-ring div {
    box-sizing: border-box;
    display: block;
    position: absolute;
    width: 64px;
    height: 64px;
    margin: 8px;
    border: 8px solid #fff;
    border-radius: 50%;
    animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    border-color: #fff transparent transparent transparent;
    }
    .lds-ring div:nth-child(1) {
    animation-delay: -0.45s;
    }
    .lds-ring div:nth-child(2) {
    animation-delay: -0.3s;
    }
    .lds-ring div:nth-child(3) {
    animation-delay: -0.15s;
    }
    @keyframes lds-ring {
    0% {
    transform: rotate(0deg);
    }
    100% {
    transform: rotate(360deg);
    }
    }

  </style>
  <title>萝幼院</title>
  <link rel="manifest" href="manifest.json">
  <script src="js/hls.js"  type="application/javascript"></script>
  <script>
    // The value below is injected by flutter build, do not touch.
    window.flutterWebRenderer = "html";
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script>document.write('<script src="flutter.js?t=' + new Date().getTime() + '" defer><\/script>')</script>

<body style="background-color: #130F32;overflow-x: hidden;width:100%;overscroll-behavior-x: none;">
<div style="width:100px;height:100px;position: fixed;top:50%;left:50%;transform: translate(-50%,-50%);color:white;" id="loading">
    <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
</div>
<script>
window.addEventListener('load', function(ev) {
  // Download main.dart.js
  _flutter.loader.loadEntrypoint({
    serviceWorker: {
      serviceWorkerVersion: serviceWorkerVersion,
    }
  }).then(function(engineInitializer) {
    return engineInitializer.initializeEngine();
  }).then(function(appRunner) {
    document.getElementById("loading").remove();
    return appRunner.runApp();
  });
});
</script>
<script src="js/jsQR.min.js"></script>

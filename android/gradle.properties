org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# 强制指定 JDK 11 路径 (请确保这是你电脑上的真实路径)
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-11.0.15.jdk/Contents/Home


# 彻底关闭导致空指针的 ArtifactTransform 优化
android.enableDexingArtifactTransform=false
android.enableDexingArtifactTransform.mirroring=false

# 关闭增量 Dex，防止它去寻找旧的 results.bin
android.incremental.dexing=false